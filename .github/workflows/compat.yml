name: compat

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: MongoDB ${{ matrix.mongodb }} / mongosh ${{ matrix.mongosh }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mongodb: ['4.0', '4.4', '5.0', '6.0', '7.0', '8.0']
        mongosh: ['1.x', '2.x']
        exclude:
          # mongosh 2.x needs MongoDB 4.2+.
          - mongodb: '4.0'
            mongosh: '2.x'
        include:
          # The client comes from a mongo image that bundles that mongosh version.
          - mongosh: '1.x'
            client: mongo:6.0.4   # mongosh 1.8.0
          - mongosh: '2.x'
            client: mongo:8.0     # newest mongosh 2.x
          # The last 1.x release, the one the README suggests for MongoDB 4.0.
          - mongodb: '4.0'
            mongosh: '1.10.6'
            client: mongo:7.0.0   # mongosh 1.10.6
    steps:
      - uses: actions/checkout@v4
      - name: Run test/compat.js
        run: test/run.sh mongo:${{ matrix.mongodb }} ${{ matrix.client }}

  # Formatting only (mongosh --nodb), on each OS a DBA might run mongosh from.
  format:
    name: ${{ matrix.os }} / mongosh ${{ matrix.mongosh }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        mongosh: ['1.8.0', '2.14.2']
    env:
      MONGOTAB_LANG: zh_CN.UTF-8
      MONGOTAB_TZ: '+08:00'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install mongosh ${{ matrix.mongosh }}
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64)   pkg=linux-x64.tgz ;;
            macOS-ARM64) pkg=darwin-arm64.zip ;;
            macOS-X64)   pkg=darwin-x64.zip ;;
            Windows-X64) pkg=win32-x64.zip ;;
            *) echo "no mongosh package for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/mongosh" && cd "$RUNNER_TEMP/mongosh"
          curl -fsSL -o "pkg-$pkg" "https://downloads.mongodb.com/compass/mongosh-${{ matrix.mongosh }}-$pkg"
          case "$pkg" in *.tgz) tar xzf "pkg-$pkg" ;; *) unzip -q "pkg-$pkg" ;; esac
          bin=$(dirname "$(find "$PWD" -type f \( -name mongosh -o -name mongosh.exe \) | head -n 1)")
          if [ "$RUNNER_OS" = Windows ]; then bin=$(cygpath -w "$bin"); fi
          echo "$bin" >> "$GITHUB_PATH"
      - name: Run test/format.js
        run: mongosh --nodb --quiet test/format.js

  # The legacy mongo shell (MongoDB 5.0 and earlier), against a server of the
  # same version, plus the no-database formatting test in that shell.
  legacy:
    name: legacy mongo shell ${{ matrix.mongodb }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mongodb: ['3.6', '4.0', '4.2', '4.4', '5.0']
    env:
      MONGO_SHELL: mongo
      MONGOTAB_LANG: zh_CN.UTF-8
      MONGOTAB_TZ: '+08:00'
    steps:
      - uses: actions/checkout@v4
      - name: Run test/compat.js
        run: test/run.sh mongo:${{ matrix.mongodb }}
      - name: Run test/format.js
        run: test/format.sh mongo:${{ matrix.mongodb }}

  # mt.shards(), mt.balancer(), mt.pool() and the mongos behaviour of the others, on a
  # throwaway sharded cluster (config server, three shards, mongos; see
  # test/shard.sh), then again with one shard stopped (test/shard-down.js).
  sharded:
    name: sharded ${{ matrix.mongodb }} / ${{ matrix.shell }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mongodb: '3.6'
            shell: mongo
            client: mongo:3.6
          - mongodb: '4.4'
            shell: mongosh 1.x
            client: mongo:6.0.4   # mongosh 1.8.0
          - mongodb: '5.0'
            shell: mongosh 2.x
            client: mongo:8.0
          - mongodb: '7.0'
            shell: mongosh 2.x
            client: mongo:8.0
          - mongodb: '8.0'
            shell: mongosh 2.x
            client: mongo:8.0
    steps:
      - uses: actions/checkout@v4
      - name: Run test/shard.js
        run: |
          if [ "${{ matrix.shell }}" = mongo ]; then export MONGO_SHELL=mongo; fi
          test/shard.sh mongo:${{ matrix.mongodb }} ${{ matrix.client }}

  # mt.users() against a mongod started with --auth (test/auth.sh): logged in
  # as root, and as a user that may not list users.
  auth:
    name: auth ${{ matrix.mongodb }} / ${{ matrix.shell }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mongodb: '3.6'
            shell: mongo
            client: mongo:3.6
          - mongodb: '4.4'
            shell: mongosh 1.x
            client: mongo:6.0.4   # mongosh 1.8.0
          - mongodb: '8.0'
            shell: mongosh 2.x
            client: mongo:8.0
    steps:
      - uses: actions/checkout@v4
      - name: Run test/auth.js
        run: |
          if [ "${{ matrix.shell }}" = mongo ]; then export MONGO_SHELL=mongo; fi
          test/auth.sh mongo:${{ matrix.mongodb }} ${{ matrix.client }}

  # mt.flow() on a two-member replica set (test/flow.sh): normal, throttled while
  # the secondary is fsyncLock'ed, after it caught up, and on the secondary.
  flow:
    name: flow ${{ matrix.mongodb }} / ${{ matrix.shell }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mongodb: '4.2'
            shell: mongo
            client: mongo:4.2
          - mongodb: '4.4'
            shell: mongosh 1.x
            client: mongo:6.0.4   # mongosh 1.8.0
          - mongodb: '8.0'
            shell: mongosh 2.x
            client: mongo:8.0
    steps:
      - uses: actions/checkout@v4
      - name: Run test/flow.js
        run: |
          if [ "${{ matrix.shell }}" = mongo ]; then export MONGO_SHELL=mongo; fi
          test/flow.sh mongo:${{ matrix.mongodb }} ${{ matrix.client }}

  # mt.initialSync() while a new member goes through initial sync, held at each
  # step with failpoints (test/isync.sh): copying after two failed attempts, on
  # the primary, just before it finishes, and after it became a secondary.
  isync:
    name: initial sync ${{ matrix.mongodb }} / ${{ matrix.shell }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mongodb: '3.6'
            shell: mongo
            client: mongo:3.6
          - mongodb: '4.4'
            shell: mongosh 1.x
            client: mongo:6.0.4   # mongosh 1.8.0
          - mongodb: '8.0'
            shell: mongosh 2.x
            client: mongo:8.0
    steps:
      - uses: actions/checkout@v4
      - name: Run test/isync.js
        run: |
          if [ "${{ matrix.shell }}" = mongo ]; then export MONGO_SHELL=mongo; fi
          test/isync.sh mongo:${{ matrix.mongodb }} ${{ matrix.client }}

  # mt.concern() on a PSA replica set whose primary counts write concerns
  # (test/concern.sh): implicit defaults, counts per level, this connection's
  # settings, and defaults set with setDefaultRWConcern.
  concern:
    name: concern ${{ matrix.mongodb }} / ${{ matrix.shell }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mongodb: '4.2'
            shell: mongo
            client: mongo:4.2
          - mongodb: '4.4'
            shell: mongosh 1.x
            client: mongo:6.0.4   # mongosh 1.8.0
          - mongodb: '8.0'
            shell: mongosh 2.x
            client: mongo:8.0
    steps:
      - uses: actions/checkout@v4
      - name: Run test/concern.js
        run: |
          if [ "${{ matrix.shell }}" = mongo ]; then export MONGO_SHELL=mongo; fi
          test/concern.sh mongo:${{ matrix.mongodb }} ${{ matrix.client }}

  # One stable check name for branch protection, so the jobs above can change
  # without editing the required checks.
  compat:
    name: compat
    if: always()
    needs: [test, format, legacy, sharded, auth, flow, isync, concern]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        run: |
          test "${{ needs.test.result }}" = success
          test "${{ needs.format.result }}" = success
          test "${{ needs.legacy.result }}" = success
          test "${{ needs.sharded.result }}" = success
          test "${{ needs.auth.result }}" = success
          test "${{ needs.flow.result }}" = success
          test "${{ needs.isync.result }}" = success
          test "${{ needs.concern.result }}" = success
