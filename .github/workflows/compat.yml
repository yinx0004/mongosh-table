name: compat

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: MongoDB ${{ matrix.mongodb }} / mongosh ${{ matrix.mongosh }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mongodb: ['4.0', '4.4', '5.0', '6.0', '7.0', '8.0']
        mongosh: ['1.x', '2.x']
        exclude:
          # mongosh 2.x needs MongoDB 4.2+.
          - mongodb: '4.0'
            mongosh: '2.x'
        include:
          # The client comes from a mongo image that bundles that mongosh version.
          - mongosh: '1.x'
            client: mongo:6.0.4   # mongosh 1.8.0
          - mongosh: '2.x'
            client: mongo:8.0     # newest mongosh 2.x
          # The last 1.x release, the one the README suggests for MongoDB 4.0.
          - mongodb: '4.0'
            mongosh: '1.10.6'
            client: mongo:7.0.0   # mongosh 1.10.6
    steps:
      - uses: actions/checkout@v4
      - name: Run test/compat.js
        run: test/run.sh mongo:${{ matrix.mongodb }} ${{ matrix.client }}

  # Formatting only (mongosh --nodb), on each OS a DBA might run mongosh from.
  format:
    name: ${{ matrix.os }} / mongosh ${{ matrix.mongosh }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        mongosh: ['1.8.0', '2.14.2']
    env:
      MONGOTAB_LANG: zh_CN.UTF-8
      MONGOTAB_TZ: '+08:00'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install mongosh ${{ matrix.mongosh }}
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64)   pkg=linux-x64.tgz ;;
            macOS-ARM64) pkg=darwin-arm64.zip ;;
            macOS-X64)   pkg=darwin-x64.zip ;;
            Windows-X64) pkg=win32-x64.zip ;;
            *) echo "no mongosh package for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/mongosh" && cd "$RUNNER_TEMP/mongosh"
          curl -fsSL -o "pkg-$pkg" "https://downloads.mongodb.com/compass/mongosh-${{ matrix.mongosh }}-$pkg"
          case "$pkg" in *.tgz) tar xzf "pkg-$pkg" ;; *) unzip -q "pkg-$pkg" ;; esac
          bin=$(dirname "$(find "$PWD" -type f \( -name mongosh -o -name mongosh.exe \) | head -n 1)")
          if [ "$RUNNER_OS" = Windows ]; then bin=$(cygpath -w "$bin"); fi
          echo "$bin" >> "$GITHUB_PATH"
      - name: Run test/format.js
        run: mongosh --nodb --quiet test/format.js

  # The legacy mongo shell is not supported; loading there must print a clear
  # message instead of throwing.
  legacy:
    name: legacy mongo shell ${{ matrix.mongodb }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mongodb: ['3.6', '4.0', '4.2', '4.4', '5.0']
    steps:
      - uses: actions/checkout@v4
      - name: Run test/legacy.sh
        run: test/legacy.sh mongo:${{ matrix.mongodb }}

  # One stable check name for branch protection, so the jobs above can change
  # without editing the required checks.
  compat:
    name: compat
    if: always()
    needs: [test, format, legacy]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        run: |
          test "${{ needs.test.result }}" = success
          test "${{ needs.format.result }}" = success
          test "${{ needs.legacy.result }}" = success
